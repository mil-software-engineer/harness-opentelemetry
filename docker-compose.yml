# Local observability stack for DeepSeek Harness (DSH) token/usage telemetry.
#
# Data flow (all local, no external SaaS):
#   DSH --OTLP/HTTP logs--> otel-collector:4318 --> transformer:8000/v1/logs
#   transformer --Prometheus counter--> prometheus:9090 <-- scrape
#   grafana:3000 queries prometheus:9090
#
# The transformer is the only component with logic: DSH ships OTLP *logs*, so it
# converts them into the `dsh_tokens_total` Prometheus counter that Prometheus
# scrapes. See configs/otel.yaml and transformer/app.py.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel.yaml"]
    depends_on:
      transformer:
        condition: service_healthy
    ports:
      # DSH points DSH_TELEMETRY_OTLP_URL at this host port.
      - "4318:4318"
    volumes:
      - ./configs/otel.yaml:/etc/otel.yaml:ro

  transformer:
    build: ./transformer
    image: dsh-telemetry-transformer:local
    container_name: transformer
    restart: unless-stopped
    environment:
      # Edge-cost pricing table mounted below (see configs/pricing.json).
      PRICING_FILE: /app/pricing.json
    expose:
      # Internal port the collector forwards logs to and Prometheus scrapes.
      - "8000"
    ports:
      # Convenience host mapping for manual inspection:
      #   curl http://localhost:8002/metrics
      - "8002:8000"
    volumes:
      - ./configs/pricing.json:/app/pricing.json:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      transformer:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus

  # Local log store: the otel-collector re-exports the DSH OTLP log stream here
  # (parallel to the transformer) so Grafana can query raw logs / session context.
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
