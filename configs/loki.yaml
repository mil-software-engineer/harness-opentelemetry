# Minimal single-binary Loki configuration for the local DSH log store.
#
# Loki receives OTLP/HTTP logs (re-exported by the otel-collector in parallel to
# the transformer) on :3100/otlp and stores them locally on disk. Everything runs
# in-process (single binary, no memberlist/gateway) for the local stack.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h
